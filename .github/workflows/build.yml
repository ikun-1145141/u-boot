name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo dpkg --add-architecture i386
          sudo apt update
          sudo apt install -y make imagemagick fonts-dejavu-core libc6:i386 libncurses6:i386 libstdc++6:i386 lib32z1

      - name: 下载工具链
        run: |
          curl -L -O https://developer.arm.com/-/cdn-downloads/permalink/legacy-linaro-gnu-toolchains/4.9-2017.01/gcc-linaro-4.9.4-2017.01-x86_64_arm-eabi.tar.xz
          tar xvf ./gcc-linaro-4.9.4-2017.01-x86_64_arm-eabi.tar.xz

      - name: 编译
        run: |
          # 1. 将解压后的 bin 目录加入 PATH
          export PATH="$(pwd)/gcc-linaro-4.9.4-2017.01-x86_64_arm-eabi/bin:$PATH"
          
          # 2. 定义交叉编译前缀
          export SYS_COM="$(pwd)/gcc-linaro-4.9.4-2017.01-x86_64_arm-eabi/bin/arm-eabi-"

          # 3. 三板斧编译
          make distclean
          make m8b_onecloud_config CROSS_COMPILE=$SYS_COM
          make -j$(nproc) CROSS_COMPILE=$SYS_COM

      - name: 下载 AmlImg
        run: |
          ver="v0.3.0"
          curl -L -o ./AmlImg https://github.com/hzyitc/AmlImg/releases/download/$ver/AmlImg_${ver}_linux_amd64
          chmod +x ./AmlImg

      - name: 生成资源包
        run: |
          mkdir -p resource

          # 将 my_logo/uboot.png 转换为 640x360 的 24bit BMP 作为启动 logo
          convert my_logo/uboot.png -resize 640x360 BMP3:resource/bootup.bmp

          cat <<EOF >resource/list.txt
          090000:bootup:bootup.bmp
          EOF
          ./AmlImg res_pack build/resource.img resource/

      - name: 生成 eMMC 烧录镜像
        run: |
          mkdir -p pack

          cp build/ddr_init.bin pack/DDR.USB
          cp build/u-boot-comp.bin pack/UBOOT_COMP.USB

          cat <<EOF >pack/aml_sdc_burn.ini
          [common]
          erase_bootloader    = 1
          erase_flash         = 0
          reboot              = 0

          ;package will filled by sdacard burning tool
          [burn_ex]
          package     = aml_upgrade_package.img
          ;media       =
          EOF

          cat <<EOF >pack/platform.conf
          Platform:0x0801
          BinPara:0xd9010000
          DDRLoad:0xd9000000
          DDRRun:0xd9000030
          Uboot_down:0x200000
          Uboot_decomp:0xd9000030
          EOF

          cp build/u-boot.bin pack/bootloader.img
          echo -n "sha1sum $(sha1sum pack/bootloader.img | awk '{print $1}')" >pack/bootloader.VERIFY

          cp build/resource.img pack/resource.img
          echo -n "sha1sum $(sha1sum pack/resource.img | awk '{print $1}')" >pack/resource.VERIFY

          cat <<EOF >pack/commands.txt
          USB:DDR:normal:DDR.USB
          USB:UBOOT_COMP:normal:UBOOT_COMP.USB

          ini:aml_sdc_burn:normal:aml_sdc_burn.ini
          conf:platform:normal:platform.conf

          PARTITION:bootloader:normal:bootloader.img
          VERIFY:bootloader:normal:bootloader.VERIFY

          PARTITION:resource:normal:resource.img
          VERIFY:resource:normal:resource.VERIFY

          # PARTITION:boot:normal:boot.img
          # VERIFY:boot:normal:boot.VERIFY
          # PARTITION:rootfs:normal:rootfs.img
          # VERIFY:rootfs:normal:rootfs.VERIFY
          EOF

          ./AmlImg pack build/eMMC.burn.img pack/

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: onecloud-uboot-artifacts
          path: |
            build/*.bin
            build/resource.img
            build/eMMC.burn.img

      - name: 发布 Release
        run: |
          time="${{ github.event.head_commit.timestamp }}"
          sha="${GITHUB_SHA:0:8}"
          tag="build-$(date +'%Y%m%d-%H%M' -d "$time")"
          message="自动构建 $(date +'%Y-%m-%d %H:%M' -d "$time")"
          
          # 使用 gh 命令行工具创建 Release 并上传附件
          gh release create "$tag" \
            --title "$message" \
            --notes "由提交 $sha 自动构建" \
            build/*.bin \
            build/resource.img \
            build/eMMC.burn.img
        env:
          GITHUB_TOKEN: ${{ github.token }}