name: Build

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo dpkg --add-architecture i386 # 2. 开启 32 位架构支持
          sudo apt update
          # 1. 24.04 中将 ttf-dejavu 改为了 fonts-dejavu-core
          # 2. 将 libncurses5 改为兼容性更好的 libncurses6:i386
          sudo apt install -y make imagemagick fonts-dejavu-core gcc-arm-none-eabi

      - name: Download toolchain
        run: |
          echo "Using Ubuntu system build-in arm-none-eabi-gcc toolchain."

      - name: Build
        run: |
          # 1. 修复 main.c inline 别名冲突
          sed -i 's/inline void __show_boot_progress/void __show_boot_progress/g' common/main.c
          sed -i 's/void inline __show_boot_progress/void __show_boot_progress/g' common/main.c

          # 2. 强效修复：将 asm/io.h 里的所有 inline 无差别全换成 static inline 阻断重复定义
          sed -i 's/\binline\b/static inline/g' arch/arm/include/asm/io.h
          sed -i 's/static static inline/static inline/g' arch/arm/include/asm/io.h

          # 3. 修复 GCC 13 找不到 compiler-gcc13.h 的限制
          cd include/linux/
          if [ -f compiler-gcc4.h ]; then
            cp compiler-gcc4.h compiler-gcc13.h
          elif [ -f compiler-gcc*.h ]; then
            cp $(ls compiler-gcc*.h | head -n 1) compiler-gcc13.h
          fi
          cd ../../

          make distclean
          # 4. 执行单板配置生成
          make m8b_onecloud_config CROSS_COMPILE=arm-none-eabi-
          
          # 5. 【核心隔离手术】建立一个纯净的宿主机头文件目录，只存放需要的配置，绝不污染全局类型
          mkdir -p host_include/asm
          cp build/include/config.h host_include/
          cp arch/arm/include/asm/config.h host_include/asm/

          # 6. 开始编译：HOSTCFLAGS 只引入我们刚建立的干净目录，并加上 -fcommon 降级
          make -j$(nproc) CROSS_COMPILE=arm-none-eabi- \
            HOSTCFLAGS="-fcommon -I$PWD/host_include" \
            KCFLAGS="-fcommon -fno-gnu89-inline"

      - name: Download AmlImg
        run: |
          ver="v0.3.0"
          curl --help
          curl -L -o ./AmlImg https://github.com/hzyitc/AmlImg/releases/download/$ver/AmlImg_${ver}_linux_amd64
          chmod +x ./AmlImg

      - name: Generate resource
        run: |
          mkdir -p resource
          
          # 使用 convert 工具把你提交的 PNG 完美转换为标准 U-Boot BMP3 格式
          # -background black: 如果你的 PNG 有透明图层，透明部分会自动填充为纯黑
          convert my_logo/uboot.png -background black -flatten BMP3:resource/bootup.bmp

          cat <<EOF >resource/list.txt
          090000:bootup:bootup.bmp
          EOF
          ./AmlImg res_pack build/resource.img resource/

      - name: Generate eMMC burn image
        run: |
          mkdir -p pack

          cp build/ddr_init.bin pack/DDR.USB
          cp build/u-boot-comp.bin pack/UBOOT_COMP.USB

          cat <<EOF >pack/aml_sdc_burn.ini
          [common]
          erase_bootloader    = 1
          erase_flash         = 0
          reboot              = 0

          ;package will filled by sdacard burning tool
          [burn_ex]
          package     = aml_upgrade_package.img
          ;media       =
          EOF

          cat <<EOF >pack/platform.conf
          Platform:0x0801
          BinPara:0xd9010000
          DDRLoad:0xd9000000
          DDRRun:0xd9000030
          Uboot_down:0x200000
          Uboot_decomp:0xd9000030
          EOF

          cp build/u-boot.bin pack/bootloader.img
          echo -n "sha1sum $(sha1sum pack/bootloader.img | awk '{print $1}')" >pack/bootloader.VERIFY

          cp build/resource.img pack/resource.img
          echo -n "sha1sum $(sha1sum pack/resource.img | awk '{print $1}')" >pack/resource.VERIFY

          cat <<EOF >pack/commands.txt
          USB:DDR:normal:DDR.USB
          USB:UBOOT_COMP:normal:UBOOT_COMP.USB

          ini:aml_sdc_burn:normal:aml_sdc_burn.ini
          conf:platform:normal:platform.conf

          PARTITION:bootloader:normal:bootloader.img
          VERIFY:bootloader:normal:bootloader.VERIFY

          PARTITION:resource:normal:resource.img
          VERIFY:resource:normal:resource.VERIFY

          # PARTITION:boot:normal:boot.img
          # VERIFY:boot:normal:boot.VERIFY
          # PARTITION:rootfs:normal:rootfs.img
          # VERIFY:rootfs:normal:rootfs.VERIFY
          EOF

          ./AmlImg pack build/eMMC.burn.img pack/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: onecloud-uboot-artifacts
          path: |
            build/*.bin
            build/resource.img
            build/eMMC.burn.img

      - name: Release
        run: |
          time="${{ github.event.head_commit.timestamp }}"
          sha="${GITHUB_SHA:0:8}"
          tag="build-$(date +'%Y%m%d-%H%M' -d "$time")"
          message="Auto-Build $(date +'%Y-%m-%d %H:%M' -d "$time")"
          hub release create  -t "$GITHUB_SHA" "$tag" -m "$message" \
            $(for a in build/*.bin; do echo -a $a; done) \
            -a build/resource.img \
            -a build/eMMC.burn.img
        env:
          GITHUB_TOKEN: ${{ github.token }}
